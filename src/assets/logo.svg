<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none">
  <!-- Sky / upper atmosphere -->
  <rect width="120" height="80" fill="#1a2a4a"/>
  
  <!-- Wave layers -->
  <path d="M0 35 Q15 28 30 35 T60 35 T90 35 T120 35 L120 45 Q105 38 90 45 T60 45 T30 45 T0 45 Z" fill="#4a6fa5" opacity="0.9"/>
  <path d="M0 42 Q20 36 40 42 T80 42 T120 42 L120 52 Q100 46 80 52 T40 52 T0 52 Z" fill="#5b8def" opacity="0.85"/>
  <path d="M0 48 Q25 42 50 48 T100 48 L120 48 L120 58 Q95 52 70 58 T20 58 T0 58 Z" fill="#6b9fd4"/>
  
  <!-- Water line -->
  <line x1="0" y1="50" x2="120" y2="50" stroke="#64dfdf" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Underwater -->
  <rect x="0" y="50" width="120" height="30" fill="#2a4a6a" opacity="0.7"/>
  
  <!-- Golden arrow pointing down into water -->
  <path d="M60 8 L56 22 L58 22 L58 38 L62 38 L62 22 L64 22 Z" fill="#d4a017"/>
  <path d="M60 38 L54 32 L66 32 Z" fill="#d4a017"/>
  
  <!-- Upside-down tan-brown triangle (mountain underwater) -->
  <path d="M60 55 L45 72 L75 72 Z" fill="#c4a77d" stroke="#8b7355" stroke-width="1"/>
  <path d="M60 58 L50 70 L70 70 Z" fill="#a08060" opacity="0.6"/>
</svg>
